  <style>
    /* Custom select styles */
    .custom-select {
      position: relative;
      width: 100%;
    }

    .select-selected {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: var(--font-body);
      font-weight: 400;
      display: flex;
      align-items: center;
      min-height: 24px;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .select-selected:hover {
      border-color: var(--accent-dim);
    }

    .select-selected:focus {
      outline: none;
      border-color: var(--accent-dim);
    }

    .select-selected:after {
      content: "▼";
      position: absolute;
      right: 10px;
      font-size: 12px;
      color: var(--text-dim);
      pointer-events: none;
    }

    .select-items {
      position: absolute;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 4px 4px;
      max-height: 300px;
      overflow-y: auto;
      width: 100%;
      z-index: 99;
      display: none;
      box-shadow: 0 4px 8px var(--bg-overlay);
    }

    .select-items div {
      padding: 6px 16px 6px 10px;
      cursor: pointer;
      display: block;
      min-height: 20px;
      font-size: 14px;
      font-family: var(--font-body);
      font-weight: 400;
      color: var(--text-primary);
      transition: background-color 0.2s ease;
    }

    .select-items .select-item {
      display: flex;
      align-items: center;
    }

    .select-items div:hover {
      background-color: var(--accent-glow);
    }

    .select-items .select-item-icon {
      width: 24px;
      height: 24px;
      margin-right: 8px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      flex-shrink: 0;
    }

    .select-items .optgroup-label {
      font-weight: 600;
      background-color: var(--bg-subtle);
      padding: 4px 16px 4px 10px;
      cursor: default;
      color: var(--text-secondary);
      font-size: 12px;
      font-family: var(--font-body);
      letter-spacing: 0.5px;
    }

    .select-items .optgroup-label:hover {
      background-color: var(--bg-subtle);
    }

    .custom-select.open .select-selected {
      border-radius: 4px 4px 0 0;
      border-bottom-color: var(--bg-card);
    }

    .custom-select.open .select-items {
      display: block;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .select-items .select-item-icon {
        width: 18px;
        height: 18px;
      }
    }
  </style>

    // Populate compound custom select

    const compoundSelectSelected = compoundSelectContainer.querySelector('.select-selected');
    const compoundSelectItems = compoundSelectContainer.querySelector('.select-items');
    const compoundCategories = {};

    compoundItems.forEach(item => {
      if (!compoundCategories[item.category]) {
        compoundCategories[item.category] = document.createElement("div");
        compoundCategories[item.category].className = "optgroup-label";
        compoundCategories[item.category].textContent = item.category;
        compoundSelectItems.appendChild(compoundCategories[item.category]);
      }

      let itemDiv = document.createElement("div");
      itemDiv.setAttribute('data-value', item.name);
      itemDiv.className = 'select-item';
      itemDiv.innerHTML = `
        <div class="select-item-icon" style="background-image: url('icons/${item.icon}');"></div>
        <span>${item.name}</span>
      `;

      itemDiv.addEventListener('click', function () {
        compoundSelectSelected.innerHTML = `
          <div class="select-item-icon" style="background-image: url('icons/${item.icon}');"></div>
          <span>${item.name}</span>
        `;
        compoundSelectSelected.setAttribute('data-value', item.name);
        compoundSelectContainer.classList.remove('open');
        // Trigger change event
        const event = new CustomEvent('change', { detail: { value: item.name } });
        compoundSelectContainer.dispatchEvent(event);
      });

      compoundCategories[item.category].appendChild(itemDiv);
    });

    // Handle compound custom select open/close
    compoundSelectSelected.addEventListener('click', function () {
      compoundSelectContainer.classList.toggle('open');
    });

    // Close when clicking outside
    document.addEventListener('click', function (e) {
      if (!compoundSelectContainer.contains(e.target)) {
        compoundSelectContainer.classList.remove('open');
      }
    });

    // Handle compound item change
    compoundSelectContainer.addEventListener('change', function (e) {
      const selected = compoundItems.find(i => i.name === e.detail.value);
      const itemValueLabel = document.querySelector('label[for="compoundItemValue"]');
      const itemValueInput = document.getElementById("compoundItemValue");
      const materialLabel = document.querySelector('label[for="materialValue"]');
      const materialInput = document.getElementById("materialValue");

      if (selected && selected.type === 1) {
        itemValueLabel.style.display = 'block';
        itemValueInput.style.display = 'block';
        materialLabel.style.display = 'none';
        materialInput.style.display = 'none';
      } else {
        itemValueLabel.style.display = 'none';
        itemValueInput.style.display = 'none';
        materialLabel.style.display = 'block';
        materialInput.style.display = 'block';
      }
    });

    // Trigger on load
    compoundSelectContainer.dispatchEvent(new CustomEvent('change', { detail: { value: compoundSelectSelected.getAttribute('data-value') || '' } }));

    // ================= HELPERS =================

    function format(num) {
      return Math.round(num).toLocaleString();
    }

    function formatAvg(num) {
      if (!isFinite(num) || num === null || num === undefined) return '';
      return Number(num).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatPercent(num) {
      if (!isFinite(num) || num === 0) {
        return '0';
      }

      let sign = num < 0 ? '-' : '';
      let absValue = Math.abs(num);

      // Normalize floating point error by limiting decimal digits before string conversion.
      let normalized = absValue.toFixed(12);
      let raw = normalized.replace(/0+$/, '').replace(/\.$/, '');
      let [intPart, rawFrac = ''] = raw.split('.');

      // If the value is so small it disappears in fixed decimals, use exponential notation
      if (intPart === '0' && rawFrac.replace(/0/g, '') === '') {
        return sign + absValue.toExponential(3);
      }

      if (!rawFrac) {
        return sign + intPart;
      }

      // Start with up to 3 decimals, then extend if there are fewer than 3 non-zero decimals
      let displayFrac = rawFrac.slice(0, 3);
      let nonzeroCount = (displayFrac.match(/[1-9]/g) || []).length;

      for (let i = 3; i < rawFrac.length && nonzeroCount < 3; i++) {
        displayFrac += rawFrac[i];
        if (rawFrac[i] !== '0') {
          nonzeroCount += 1;
        }
      }

      // Trim trailing zeros
      displayFrac = displayFrac.replace(/0+$/, '');

      if (displayFrac === '') {
        return sign + intPart;
      }

      return sign + intPart + '.' + displayFrac;
    }

    // ================= PITY =================
    // Matches AdminEnchant iteration counts:
    // - Regular enchant: 100M (approximated to 10M for web performance)
    // - Synthesis/Type2: 10M (matching AdminEnchant CONFIG_ITERATION2)
    function simulatePity(rate) {

      const isMobile = window.innerWidth < 768;
      const iterations = isMobile ? 10000 : 100000;  // Increased from 10K/100K to match AdminEnchant

      const key = rate + "_" + iterations;

      if (pityCache[key]) {
        return pityCache[key];
      }

      let successCount = 0;

      // Simulate CONFIG_ITERATION2 (10M) independent attempts
      // Each "attempt" is one roll cycle from 0 gauge to success
      for (let i = 0; i < iterations; i++) {
        let gauge = 0;
        let attempts = 0;

        while (true) {
          attempts++;

          if (Math.random() * 100 < rate) break;  // Success roll

          if (gauge >= 100) break;  // Pity guarantee

          gauge += rate;
        }

        successCount += attempts;
      }

      // Return average attempts needed for one success at this rate
      const result = successCount / iterations;
      pityCache[key] = result;

      return result;
    }

    // ================= CALCULATE ENCHANT =================

    function calculateEnchant() {

      for (let key in pityCache) {
        delete pityCache[key];
      }

      const selected = items.find(i => i.name === document.querySelector("#itemSelect .select-selected").getAttribute('data-value'));

      // VALIDATION
      if (!selected) {
        alert("Please select a valid item.");
        return;
      }

      const targetInput = parseInt(document.getElementById("targetLevel").value);
      const itemValueRaw = document.getElementById("itemValue").value;
      const itemValue = itemValueRaw ? parseFloat(itemValueRaw) : null;
      const usePity = document.getElementById("usePity").checked;

      const maxLevel = selected.max;
      const target = (!targetInput || targetInput > maxLevel) ? maxLevel : targetInput;

      const table = document.getElementById("resultTable");
      const head = document.getElementById("tableHead");

      table.innerHTML = '';
      document.getElementById("tableWrapper").style.display = 'block';

      // Dynamic header
      head.innerHTML = `
  <tr>
    <th>Enchant Level</th>
    <th>Success Rate</th>
    <th>Cumulative Success Rate</th>
    <th>Required Items</th>
    <th>Cost</th>
    ${usePity ? `
      <th>Avg Cumulative Success Rate</th>
      <th>Avg Required Items</th>
      <th>Avg Cost</th>
    ` : ''}
  </tr>
  `;

      let expected = 1;
      let avgExpected = 1;
      let perfect = 1;
      let avgPerfect = 1;

      for (let i = 0; i < target; i++) {

        let rate = selected.rates[i] / 100;

        expected *= (1 / rate);
        perfect *= rate;

        let requiredItems = Math.ceil(expected);
        let totalCost = itemValue ? requiredItems * itemValue : null;

        let extra = '';

        if (usePity) {
          let pityAttempts = simulatePity(selected.rates[i]);

          avgExpected *= pityAttempts;

          let effectiveRate = 1 / pityAttempts;
          avgPerfect *= effectiveRate;

          let avgRequired = Math.ceil(avgExpected);
          let avgCost = itemValue ? avgRequired * itemValue : null;

          extra = `
        <td>${formatPercent(avgPerfect * 100)}%</td>
        <td>${format(avgRequired)}</td>
        <td>${avgCost ? format(avgCost) : ''}</td>
      `;
        }

        let row = `
      <tr>
        <td>+${i + 1}</td>
        <td>${selected.rates[i]}%</td>
        <td>${formatPercent(perfect * 100)}%</td>
        <td>${format(requiredItems)}</td>
        <td>${totalCost ? format(totalCost) : ''}</td>
        ${extra}
      </tr>
    `;

        table.innerHTML += row;
      }
    }

    // ================= CALCULATE COMPOUND =================

    function calculateCompound() {

      for (let key in pityCache) {
        delete pityCache[key];
      }

      const selected = compoundItems.find(i => i.name === document.querySelector("#compoundItemSelect .select-selected").getAttribute('data-value'));

      // VALIDATION
      if (!selected) {
        alert("Please select a valid item.");
        return;
      }

      const targetInput = parseInt(document.getElementById("compoundTargetLevel").value);
      const itemValueRaw = document.getElementById("compoundItemValue").value;
      const itemValue = itemValueRaw ? parseFloat(itemValueRaw) : null;
      const materialValueRaw = document.getElementById("materialValue").value;
      const materialValue = materialValueRaw ? parseFloat(materialValueRaw) : null;
      const usePity = document.getElementById("compoundUsePity").checked;

      const maxLevel = selected.max;
      const target = (!targetInput || targetInput > maxLevel) ? maxLevel : targetInput;

      const table = document.getElementById("compoundResultTable");
      const head = document.getElementById("compoundTableHead");

      table.innerHTML = '';
      document.getElementById("compoundTableWrapper").style.display = 'block';

      // Dynamic header - Type 2 shows only material columns
      let headerColumns = `
  <tr>
    <th>Compound Level</th>
    <th>Success Rate</th>
    <th>Cumulative Success Rate</th>
    ${selected.type === 1 ? `<th>Required Items</th><th>Cost</th>` : `<th>Required Materials</th><th>Cost</th>`}
    ${usePity ? `
      <th>Avg Cumulative Success Rate</th>
      ${selected.type === 1 ? `<th>Avg Required Items</th><th>Avg Cost</th>` : `<th>Avg Required Materials</th><th>Avg Cost</th>`}
    ` : ''}
  </tr>
  `;

      head.innerHTML = headerColumns;

      let cumulativeSuccess = 1;
      let cumulativeItems = selected.type === 1 ? 1 : 0;
      let avgCumulativeSuccess = 1;
      let avgCumulativeItems = selected.type === 1 ? 1 : 0;

      for (let i = 0; i < target - 1; i++) {

        let rate = selected.rates[i] / 100;
        cumulativeSuccess *= rate;

        if (selected.type === 1) {
          let multiplier = Math.ceil(1 + 1 / rate);
          cumulativeItems *= multiplier;
        } else {
          // Type 2: Segmented rollback system
          cumulativeItems = calculateType2Materials(i, selected);
        }

        if (usePity) {
          let avgAttempts = simulatePity(selected.rates[i]);
          avgCumulativeSuccess *= 1 / avgAttempts;
          if (selected.type === 1) {
            let avgMultiplier = avgAttempts + 1;
            avgCumulativeItems *= avgMultiplier;
          } else {
            avgCumulativeItems = calculateType2Materials(i, selected, true);
          }
        }

        let cumulativeCost = null;
        let avgCumulativeCost = null;
        let avgDisplayItems = null;

        if (selected.type === 1) {
          cumulativeCost = itemValue ? Math.ceil(cumulativeItems) * itemValue : null;
          avgDisplayItems = usePity ? Math.ceil(avgCumulativeItems) : null;
          avgCumulativeCost = usePity && itemValue ? avgDisplayItems * itemValue : null;
        } else {
          cumulativeCost = materialValue ? Math.ceil(cumulativeItems) * materialValue : null;
          avgDisplayItems = usePity ? Math.ceil(avgCumulativeItems) : null;
          avgCumulativeCost = usePity && materialValue ? avgDisplayItems * materialValue : null;
        }

        let row = `
      <tr>
        <td>${i + 2}</td>
        <td>${selected.rates[i]}%</td>
        <td>${formatPercent(cumulativeSuccess * 100)}%</td>
        <td>${format(cumulativeItems)}</td>
        <td>${cumulativeCost ? format(cumulativeCost) : ''}</td>
        ${usePity ? `
          <td class="avg-column">${formatPercent(avgCumulativeSuccess * 100)}%</td>
          <td class="avg-column">${format(avgDisplayItems)}</td>
          <td class="avg-column">${avgCumulativeCost ? format(avgCumulativeCost) : ''}</td>
        ` : ''}
      </tr>
    `;

        table.innerHTML += row;
      }
    }

    // Type 2 materials calculation - different-item with safe checkpoint segment logic
    function calculateType2Materials(levelIndex, item, isPity = false) {
      // Safe levels are checkpoints that preserve progress: e.g. [6, 12, 18, 24]
      let total = 0;
      let safepoint = 0;

      for (let i = 0; i <= levelIndex; i++) {
        let chance = item.rates[i];
        let amount;

        if (isPity) {
          // Use raw average pity attempts (float) for proper stochastic variation.
          amount = simulatePity(chance);
        } else {
          amount = Math.ceil(100 / chance);
        }

        // If current completed level (i+1) is a safe checkpoint, save the segment and reset.
        if (item.safeLevels && item.safeLevels.includes(i + 1)) {
          safepoint += total;
          total = 0;
        }

        if (total === 0) {
          total = amount;
        } else {
          total *= amount;
        }
      }

      return total + safepoint;
    }

  </script>
